[package]
name = "ISOB3TOOLS"
version = "1.0.0"
edition = "2024"
default-run = "ISOB3GUI"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
anyhow = "1"
memmap2 = "0.9"
eframe = "0.33"
egui = "0.33"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Storage_FileSystem"
] }

[[bin]]
name = "ISOB3GUI"
path = "src/main.rs"
