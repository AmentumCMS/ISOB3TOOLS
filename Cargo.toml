[package]
name = "isob3_tools"
version = "1.0.0"
edition = "2024"
default-run = "ISOB3GUI"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
sha2 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
cbc = "0.1"
hmac = "0.12"
pbkdf2 = "0.12"
anyhow = "1"
memmap2 = "0.9"
eframe = "0.33"
egui = "0.33"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO"
] }

[[bin]]
name = "ISOB3GUI"
path = "src/main.rs"
