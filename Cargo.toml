[package]
name = "isob3_tools"
version = "1.0.3"
edition = "2024"
default-run = "ISOB3GUI"

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.11.0"
sha2 = "0.11.0"
aes = "0.9.1"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
hmac = "0.13.0"
anyhow = "1"
memmap2 = "0.9"
eframe = "0.34.3"
egui = "0.34.1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
ml-kem = { version = "0.3", features = ["getrandom"] }
argon2 = "0.5"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO"
] }

[[bin]]
name = "ISOB3GUI"
path = "src/main.rs"

[[bin]]
name = "direnc"
path = "src/bin/direnc.rs"

[[bin]]
name = "blake3iso"
path = "src/bin/blake3iso.rs"

[[bin]]
name = "discdecrypt"
path = "src/bin/discdecrypt.rs"
