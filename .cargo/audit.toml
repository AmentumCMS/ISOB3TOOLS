# cargo-audit (RustSec) configuration.
#
# Ignored advisories must be justified here and revisited whenever the
# dependency tree changes. Only *unfixable* advisories belong in this list.

[advisories]
ignore = [
    # quick-xml quadratic-parsing and namespace-allocation DoS advisories.
    #
    # Reached only on Linux desktop targets, transitively through the windowing
    # and accessibility stack that the eframe GUI (ISOB3GUI) pulls in:
    #   * quick-xml 0.38.x  <- zbus_xml <- atspi <- accesskit_unix     (AT-SPI)
    #   * quick-xml 0.39.x  <- wayland-scanner <- winit                (Wayland)
    #                       <- wayland-scanner <- smithay-clipboard    (Wayland clipboard)
    #
    # Structurally unremovable, not merely version-pinned:
    #   * zbus_xml 5.x requires quick-xml ^0.38 and wayland-scanner 0.31
    #     requires ^0.39, so neither can take the fixed 0.41 (breaking for 0.x).
    #   * eframe 0.36 HARD-CODES `egui-winit` with the "clipboard" feature
    #     (features = ["clipboard"]), which pulls smithay-clipboard on Linux.
    #     There is no eframe/egui feature flag that turns clipboard off, so the
    #     quick-xml 0.39 edge cannot be dropped without dropping the GUI
    #     framework itself or vendoring a fork.
    #
    # Not reachable: quick-xml here only parses trusted, build-time Wayland
    # protocol XML (wayland-scanner proc-macro) and AT-SPI introspection XML,
    # never untrusted runtime input, and none of it compiles on the primary
    # Windows target. Revisit when the winit/accesskit/wayland stack moves to
    # quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
