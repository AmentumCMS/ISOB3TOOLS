name: Lint (rustfmt + clippy)

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR so stale runs don't waste
# runner minutes.  workflow_dispatch runs are never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Lint on both runners so `#[cfg(windows)]` and Linux-only code paths
        # are both compiled and checked by clippy.
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2 # v2
        with:
          key: lint-${{ matrix.os }}

      # rustfmt is platform-agnostic, so check formatting on one runner only.
      - name: Check formatting (rustfmt)
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
