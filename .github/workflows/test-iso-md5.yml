name: Build and Release ISOB3TOOLS

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-ubi:
    name: Build Linux GNU binaries on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            diffutils \
            file \
            gcc \
            gcc-c++ \
            make \
            which

      - name: Verify glibc version
        shell: bash
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux GNU binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-unknown-linux-gnu
          cargo build --release --bin isoenc --target x86_64-unknown-linux-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-unknown-linux-gnu

      - name: Verify built Linux binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-unknown-linux-gnu/release/blake3iso
          test -f target/x86_64-unknown-linux-gnu/release/isoenc
          test -f target/x86_64-unknown-linux-gnu/release/ISOB3GUI

      - name: Collect Linux binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/linux

          cp target/x86_64-unknown-linux-gnu/release/blake3iso \
            artifacts/linux/blake3iso-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/isoenc \
            artifacts/linux/isoenc-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/ISOB3GUI \
            artifacts/linux/ISOB3GUI-linux-x86_64-gnu

          cp README.md artifacts/linux/ || true

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries-linux
          path: artifacts/linux/**

      - name: Generate release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows binaries on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-pc-windows-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-pc-windows-gnu

      - name: Verify built Windows binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-pc-windows-gnu/release/blake3iso.exe
          test -f target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe

      - name: Collect Windows binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/windows

          cp target/x86_64-pc-windows-gnu/release/blake3iso.exe \
            artifacts/windows/blake3iso-windows-x86_64.exe
          cp target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe \
            artifacts/windows/ISOB3GUI-windows-x86_64.exe

          cp README.md artifacts/windows/ || true

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries-windows
          path: artifacts/windows/**

  make-test-iso:
    name: Create real test ISO on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Create test ISO contents
        run: |
          set -euo pipefail
          rm -rf test-iso-root out
          mkdir -p test-iso-root out

          echo "hello from github actions" > test-iso-root/README.txt
          echo "commit: $GITHUB_SHA" > test-iso-root/BUILD.txt
          mkdir -p test-iso-root/verification
          (
            cd test-iso-root
            sha256sum README.txt BUILD.txt > verification/SHA256SUMS
          )

      - name: Create base ISO
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V TEST_ISO \
            -o out/test.iso \
            test-iso-root

      - name: Upload test ISO
        uses: actions/upload-artifact@v4
        with:
          name: test-iso
          path: out/test.iso

  test-linux-ubi:
    name: Test blake3iso on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    needs: [build-linux-ubi, make-test-iso]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            diffutils \
            file \
            which

      - name: Verify glibc version
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download test ISO
        uses: actions/download-artifact@v4
        with:
          name: test-iso
          path: downloaded/test-iso

      - name: Prepare test binary
        run: |
          set -euo pipefail
          mkdir -p testbin out
          cp downloaded/linux/blake3iso-linux-x86_64-gnu testbin/blake3iso
          chmod +x testbin/blake3iso
          cp downloaded/test-iso/test.iso out/test.iso

      - name: Show base ISO info
        run: |
          set -euo pipefail
          ls -lh out/test.iso
          file out/test.iso | tee out/file-base.txt

      - name: Copy ISO for ISOB3 test
        run: |
          set -euo pipefail
          cp out/test.iso out/test-isob3.iso

      - name: Check ISO before implant
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso check out/test-isob3.iso > out/isob3-check-before.txt 2>&1; then
            echo "Expected check before implant to fail, but it passed."
            cat out/isob3-check-before.txt
            exit 1
          else
            echo "Check before implant correctly failed."
            cat out/isob3-check-before.txt
          fi

      - name: Implant ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso implant out/test-isob3.iso | tee out/isob3-implant.txt

      - name: Show ISOB3 metadata info
        run: |
          set -euo pipefail
          testbin/blake3iso info out/test-isob3.iso | tee out/isob3-info.txt

      - name: Check implanted ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso check out/test-isob3.iso | tee out/isob3-check.txt

      - name: Corrupt ISOB3 ISO and confirm failure
        shell: bash
        run: |
          set -euo pipefail
          cp out/test-isob3.iso out/test-isob3-corrupt.iso
          printf 'Y' | dd of=out/test-isob3-corrupt.iso bs=1 seek=32768 count=1 conv=notrunc

          if testbin/blake3iso check out/test-isob3-corrupt.iso > out/isob3-check-corrupt.txt 2>&1; then
            echo "Expected corrupted ISOB3 ISO verification to fail, but it passed."
            cat out/isob3-check-corrupt.txt
            exit 1
          else
            echo "Corrupted ISOB3 ISO correctly failed verification."
            cat out/isob3-check-corrupt.txt
          fi

      - name: Remove ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso remove out/test-isob3.iso | tee out/isob3-remove.txt

      - name: Check ISO after metadata removal
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso check out/test-isob3.iso > out/isob3-check-after-remove.txt 2>&1; then
            echo "Expected check after removal to fail, but it passed."
            cat out/isob3-check-after-remove.txt
            exit 1
          else
            echo "Check after removal correctly failed."
            cat out/isob3-check-after-remove.txt
          fi

      - name: Create plaintext sample for encryption tests
        run: |
          set -euo pipefail
          printf 'hello from encrypted test\n' > out/plain.txt

      - name: Encrypt sample with DBENC003 default
        run: |
          set -euo pipefail
          testbin/blake3iso encrypt out/plain.txt --password secret | tee out/dbenc003-encrypt.txt
          test -f out/plain.txt.dbenc
          test -f out/plain.txt.dbenc.isob3enc.json

      - name: Check DBENC003 ciphertext sidecar
        run: |
          set -euo pipefail
          testbin/blake3iso check out/plain.txt.dbenc | tee out/dbenc003-check.txt

      - name: Decrypt DBENC003 file and compare plaintext
        run: |
          set -euo pipefail
          testbin/blake3iso decrypt out/plain.txt.dbenc --password secret --output out/plain-dbenc003.txt | tee out/dbenc003-decrypt.txt
          cmp out/plain.txt out/plain-dbenc003.txt

      - name: Encrypt sample with DBENC002 AES-GCM
        run: |
          set -euo pipefail
          testbin/blake3iso encrypt out/plain.txt --password secret --format aes-gcm --output out/plain-aesgcm.dbenc | tee out/dbenc002-encrypt.txt
          test -f out/plain-aesgcm.dbenc
          test -f out/plain-aesgcm.dbenc.isob3enc.json

      - name: Check DBENC002 ciphertext sidecar
        run: |
          set -euo pipefail
          testbin/blake3iso check out/plain-aesgcm.dbenc | tee out/dbenc002-check.txt

      - name: Decrypt DBENC002 file and compare plaintext
        run: |
          set -euo pipefail
          testbin/blake3iso decrypt out/plain-aesgcm.dbenc --password secret --output out/plain-dbenc002.txt | tee out/dbenc002-decrypt.txt
          cmp out/plain.txt out/plain-dbenc002.txt

      - name: Reject wrong password for encrypted file
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso decrypt out/plain.txt.dbenc --password wrong --output out/should-not-exist.txt > out/dbenc-wrong-password.txt 2>&1; then
            echo "Expected decrypt with wrong password to fail, but it passed."
            cat out/dbenc-wrong-password.txt
            exit 1
          else
            echo "Wrong-password decrypt correctly failed."
            cat out/dbenc-wrong-password.txt
          fi

      - name: Upload Linux test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-linux-gnu
          path: out/

  test-linux-isoenc:
    name: Test isoenc on Ubuntu
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, make-test-iso]

    steps:
      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download test ISO
        uses: actions/download-artifact@v4
        with:
          name: test-iso
          path: downloaded/test-iso

      - name: Prepare test binaries
        run: |
          set -euo pipefail
          mkdir -p testbin out
          cp downloaded/linux/blake3iso-linux-x86_64-gnu testbin/blake3iso
          cp downloaded/linux/isoenc-linux-x86_64-gnu testbin/isoenc
          chmod +x testbin/blake3iso
          chmod +x testbin/isoenc
          cp downloaded/test-iso/test.iso out/test.iso

      - name: Build encrypted ISO from input ISO
        run: |
          set -euo pipefail
          testbin/isoenc bundle out/test.iso \
            --output out/test-encrypted.iso \
            --password secret \
            --exclude ./verification/ \
            --implant-isob3 | tee out/isoenc-bundle.txt

      - name: Check rebuilt encrypted ISO ISOB3
        run: |
          set -euo pipefail
          testbin/blake3iso check out/test-encrypted.iso | tee out/isoenc-check-isob3.txt

      - name: Extract rebuilt encrypted ISO
        run: |
          set -euo pipefail
          rm -rf out/extracted-encrypted
          mkdir -p out/extracted-encrypted
          xorriso -osirrox on -indev out/test-encrypted.iso -extract / out/extracted-encrypted

      - name: Confirm payload files were encrypted in place
        run: |
          set -euo pipefail
          test -f out/extracted-encrypted/README.txt
          test -f out/extracted-encrypted/BUILD.txt
          test -f out/extracted-encrypted/verification/SHA256SUMS
          test "$(head -c 8 out/extracted-encrypted/README.txt)" = "DBENC003"
          test "$(head -c 8 out/extracted-encrypted/BUILD.txt)" = "DBENC003"
          if test "$(head -c 8 out/extracted-encrypted/verification/SHA256SUMS)" = "DBENC003"; then
            echo "Manifest file should not have been encrypted."
            exit 1
          fi

      - name: Decrypt encrypted ISO payload files and compare plaintext
        run: |
          set -euo pipefail
          testbin/blake3iso decrypt out/extracted-encrypted/README.txt --password secret --output out/README.dec.txt | tee out/isoenc-readme-decrypt.txt
          testbin/blake3iso decrypt out/extracted-encrypted/BUILD.txt --password secret --output out/BUILD.dec.txt | tee out/isoenc-build-decrypt.txt
          printf 'hello from github actions\n' > out/README.expected.txt
          printf 'commit: %s\n' "$GITHUB_SHA" > out/BUILD.expected.txt
          cmp out/README.dec.txt out/README.expected.txt
          cmp out/BUILD.dec.txt out/BUILD.expected.txt

      - name: Confirm decrypted payload hashes still match manifest
        run: |
          set -euo pipefail
          (
            cd out
            sha256sum README.dec.txt BUILD.dec.txt > decrypted.hashes
          )
          manifest_readme="$(awk '/README.txt$/ { print $1 }' out/extracted-encrypted/verification/SHA256SUMS)"
          manifest_build="$(awk '/BUILD.txt$/ { print $1 }' out/extracted-encrypted/verification/SHA256SUMS)"
          actual_readme="$(awk '/README.dec.txt$/ { print $1 }' out/decrypted.hashes)"
          actual_build="$(awk '/BUILD.dec.txt$/ { print $1 }' out/decrypted.hashes)"
          test "$manifest_readme" = "$actual_readme"
          test "$manifest_build" = "$actual_build"

      - name: Upload isoenc test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-linux-isoenc
          path: out/

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, test-linux-ubi, test-linux-isoenc, build-windows]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-windows
          path: downloaded/windows

      - name: Prepare package directories
        run: |
          set -euo pipefail
          rm -rf dist iso-root
          mkdir -p dist/linux dist/windows iso-root

          cp downloaded/linux/* dist/linux/
          cp downloaded/windows/* dist/windows/

          cp downloaded/linux/* iso-root/
          cp downloaded/windows/* iso-root/

      - name: Create Linux archive
        run: |
          set -euo pipefail
          tar -czf dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz -C dist/linux .

      - name: Create Windows archive
        run: |
          set -euo pipefail
          (
            cd dist/windows
            zip -r ../ISOB3TOOLS-windows-x86_64.zip .
          )

      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso zip

      - name: Create ISO bundle on Ubuntu
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V ISOB3TOOLS \
            -o dist/ISOB3TOOLS-binaries.iso \
            iso-root

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip
            dist/ISOB3TOOLS-binaries.iso

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, test-linux-ubi, test-linux-isoenc, build-windows, package]

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-artifacts
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux-ubi.outputs.release_tag }}
          name: ISOB3TOOLS ${{ needs.build-linux-ubi.outputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip
            dist/ISOB3TOOLS-binaries.iso
