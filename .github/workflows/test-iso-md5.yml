name: Test ISO tools

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            file \
            zip \
            mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Linux binaries
        run: cargo build --release --bins

      - name: Verify Linux binaries exist
        run: |
          set -euo pipefail
          ls -la target/release
          test -x target/release/blake3iso
          test -x target/release/ISOB3GUI

      - name: Build Windows binaries
        run: cargo build --release --bins --target x86_64-pc-windows-gnu

      - name: Verify Windows binaries exist
        run: |
          set -euo pipefail
          ls -la target/x86_64-pc-windows-gnu/release
          test -f target/x86_64-pc-windows-gnu/release/blake3iso.exe
          test -f target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe

      - name: Collect binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          cp target/release/blake3iso artifacts/
          cp target/release/ISOB3GUI artifacts/
          cp target/x86_64-pc-windows-gnu/release/blake3iso.exe artifacts/
          cp target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe artifacts/

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries
          path: artifacts/*

      - name: Generate release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  test:
    name: Test ISOB3 workflow
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            file

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries
          path: downloaded

      - name: Prepare Linux binaries
        run: |
          set -euo pipefail
          mkdir -p target/release
          cp downloaded/blake3iso target/release/
          cp downloaded/ISOB3GUI target/release/
          chmod +x target/release/blake3iso
          chmod +x target/release/ISOB3GUI

      - name: Create test ISO contents
        run: |
          set -euo pipefail
          rm -rf test-iso-root out
          mkdir -p test-iso-root out
          echo "hello from github actions" > test-iso-root/README.txt
          echo "commit: $GITHUB_SHA" > test-iso-root/BUILD.txt

      - name: Create base ISO
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V TEST_ISO \
            -o out/test.iso \
            test-iso-root

      - name: Show base ISO info
        run: |
          set -euo pipefail
          ls -lh out/test.iso
          file out/test.iso | tee out/file-base.txt

      - name: Copy ISO for ISOB3 test
        run: |
          set -euo pipefail
          cp out/test.iso out/test-isob3.iso

      - name: Check ISO before implant
        shell: bash
        run: |
          set -euo pipefail
          if target/release/blake3iso check out/test-isob3.iso > out/isob3-check-before.txt 2>&1; then
            echo "Expected check before implant to fail, but it passed."
            cat out/isob3-check-before.txt
            exit 1
          else
            echo "Check before implant correctly failed."
            cat out/isob3-check-before.txt
          fi

      - name: Implant ISOB3 metadata
        run: |
          set -euo pipefail
          target/release/blake3iso implant out/test-isob3.iso | tee out/isob3-implant.txt

      - name: Show ISOB3 metadata info
        run: |
          set -euo pipefail
          target/release/blake3iso info out/test-isob3.iso | tee out/isob3-info.txt

      - name: Check implanted ISOB3 metadata
        run: |
          set -euo pipefail
          target/release/blake3iso check out/test-isob3.iso | tee out/isob3-check.txt

      - name: Corrupt ISOB3 ISO and confirm failure
        shell: bash
        run: |
          set -euo pipefail
          cp out/test-isob3.iso out/test-isob3-corrupt.iso
          printf 'Y' | dd of=out/test-isob3-corrupt.iso bs=1 seek=32768 count=1 conv=notrunc
          if target/release/blake3iso check out/test-isob3-corrupt.iso > out/isob3-check-corrupt.txt 2>&1; then
            echo "Expected corrupted ISOB3 ISO verification to fail, but it passed."
            cat out/isob3-check-corrupt.txt
            exit 1
          else
            echo "Corrupted ISOB3 ISO correctly failed verification."
            cat out/isob3-check-corrupt.txt
          fi

      - name: Remove ISOB3 metadata
        run: |
          set -euo pipefail
          target/release/blake3iso remove out/test-isob3.iso | tee out/isob3-remove.txt

      - name: Check ISO after metadata removal
        shell: bash
        run: |
          set -euo pipefail
          if target/release/blake3iso check out/test-isob3.iso > out/isob3-check-after-remove.txt 2>&1; then
            echo "Expected check after removal to fail, but it passed."
            cat out/isob3-check-after-remove.txt
            exit 1
          else
            echo "Check after removal correctly failed."
            cat out/isob3-check-after-remove.txt
          fi

      - name: Upload test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs
          path: out/

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries
          path: downloaded

      - name: List downloaded artifacts
        run: |
          ls -R downloaded

      - name: Prepare package directories
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/linux dist/windows

          cp downloaded/blake3iso dist/linux/
          cp downloaded/ISOB3GUI dist/linux/
          cp README.md dist/linux/ || true

          cp downloaded/blake3iso.exe dist/windows/
          cp downloaded/ISOB3GUI.exe dist/windows/
          cp README.md dist/windows/ || true

      - name: Create Linux archive
        run: |
          set -euo pipefail
          tar -czf dist/ISOB3TOOLS-linux-x86_64.tar.gz -C dist/linux .

      - name: Create Windows archive
        run: |
          set -euo pipefail
          (
            cd dist/windows
            zip -r ../ISOB3TOOLS-windows-x86_64.zip .
          )

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: |
            dist/ISOB3TOOLS-linux-x86_64.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, test, package]

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-artifacts
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ISOB3TOOLS ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ISOB3TOOLS-linux-x86_64.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip