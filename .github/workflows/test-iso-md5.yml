name: Test ISO tools

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-iso-tools:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xorriso \
            file \
            zip \
            mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Linux binaries
        run: cargo build --release --bins

      - name: Verify Linux binaries exist
        run: |
          ls -la target/release
          test -x target/release/blake3iso
          test -x target/release/ISOB3GUI

      - name: Build Windows binaries
        run: cargo build --release --bins --target x86_64-pc-windows-gnu

      - name: Verify Windows binaries exist
        run: |
          ls -la target/x86_64-pc-windows-gnu/release
          test -f target/x86_64-pc-windows-gnu/release/blake3iso.exe
          test -f target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe

      - name: Create test ISO contents
        run: |
          rm -rf test-iso-root out dist
          mkdir -p test-iso-root out dist
          echo "hello from github actions" > test-iso-root/README.txt
          echo "commit: $GITHUB_SHA" > test-iso-root/BUILD.txt

      - name: Create base ISO
        run: |
          xorriso -as mkisofs \
            -r \
            -J \
            -V TEST_ISO \
            -o out/test.iso \
            test-iso-root

      - name: Show base ISO info
        run: |
          ls -lh out/test.iso
          file out/test.iso | tee out/file-base.txt

      - name: Copy ISO for blake3 test
        run: cp out/test.iso out/test-blake3.iso

      - name: Check ISO before implant
        shell: bash
        run: |
          set -euo pipefail
          if target/release/blake3iso check out/test-blake3.iso > out/blake3-check-before.txt 2>&1; then
            echo "Expected check before implant to fail, but it passed."
            cat out/blake3-check-before.txt
            exit 1
          else
            echo "Check before implant correctly failed."
            cat out/blake3-check-before.txt
          fi

      - name: Implant BLAKE3 trailer
        run: |
          target/release/blake3iso implant out/test-blake3.iso | tee out/blake3-implant.txt

      - name: Show BLAKE3 trailer info
        run: |
          target/release/blake3iso info out/test-blake3.iso | tee out/blake3-info.txt

      - name: Check implanted BLAKE3 trailer
        run: |
          target/release/blake3iso check out/test-blake3.iso | tee out/blake3-check.txt

      - name: Corrupt BLAKE3 ISO and confirm failure
        shell: bash
        run: |
          set -euo pipefail
          cp out/test-blake3.iso out/test-blake3-corrupt.iso
          printf 'Y' | dd of=out/test-blake3-corrupt.iso bs=1 seek=32768 count=1 conv=notrunc
          if target/release/blake3iso check out/test-blake3-corrupt.iso > out/blake3-check-corrupt.txt 2>&1; then
            echo "Expected corrupted BLAKE3 ISO verification to fail, but it passed."
            cat out/blake3-check-corrupt.txt
            exit 1
          else
            echo "Corrupted BLAKE3 ISO correctly failed verification."
            cat out/blake3-check-corrupt.txt
          fi

      - name: Remove BLAKE3 trailer
        run: |
          target/release/blake3iso remove out/test-blake3.iso | tee out/blake3-remove.txt

      - name: Check ISO after trailer removal
        shell: bash
        run: |
          set -euo pipefail
          if target/release/blake3iso check out/test-blake3.iso > out/blake3-check-after-remove.txt 2>&1; then
            echo "Expected check after removal to fail, but it passed."
            cat out/blake3-check-after-remove.txt
            exit 1
          else
            echo "Check after removal correctly failed."
            cat out/blake3-check-after-remove.txt
          fi

      - name: Package Linux binaries
        run: |
          mkdir -p dist/linux
          cp target/release/blake3iso dist/linux/
          cp target/release/ISOB3GUI dist/linux/
          cp README.md dist/linux/ || true
          tar -czf dist/ISOB3TOOLS-linux-x86_64.tar.gz -C dist/linux .

      - name: Package Windows binaries
        run: |
          mkdir -p dist/windows
          cp target/x86_64-pc-windows-gnu/release/blake3iso.exe dist/windows/
          cp target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe dist/windows/
          cp README.md dist/windows/ || true
          (
            cd dist/windows
            zip -r ../ISOB3TOOLS-windows-x86_64.zip .
          )

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iso-tool-test-artifacts
          path: |
            out/
            dist/

      - name: Generate release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ISOB3TOOLS ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ISOB3TOOLS-linux-x86_64.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip