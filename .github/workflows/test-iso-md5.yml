name: Build and Release ISOB3TOOLS

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-ubi:
    name: Build Linux GNU binaries on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            file \
            gcc \
            gcc-c++ \
            make \
            which

      - name: Verify glibc version
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux GNU binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-unknown-linux-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-unknown-linux-gnu

      - name: Verify built Linux binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-unknown-linux-gnu/release/blake3iso
          test -f target/x86_64-unknown-linux-gnu/release/ISOB3GUI

      - name: Collect Linux binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/linux

          cp target/x86_64-unknown-linux-gnu/release/blake3iso \
            artifacts/linux/blake3iso-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/ISOB3GUI \
            artifacts/linux/ISOB3GUI-linux-x86_64-gnu

          cp README.md artifacts/linux/ || true

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries-linux
          path: artifacts/linux/**

      - name: Generate release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows binaries on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Build Windows binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-pc-windows-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-pc-windows-gnu

      - name: Verify built Windows binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-pc-windows-gnu/release/blake3iso.exe
          test -f target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe

      - name: Collect Windows binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/windows

          cp target/x86_64-pc-windows-gnu/release/blake3iso.exe \
            artifacts/windows/blake3iso-windows-x86_64.exe
          cp target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe \
            artifacts/windows/ISOB3GUI-windows-x86_64.exe

          cp README.md artifacts/windows/ || true

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries-windows
          path: artifacts/windows/**

  make-test-iso:
    name: Create real test ISO on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Create test ISO contents
        run: |
          set -euo pipefail
          rm -rf test-iso-root out
          mkdir -p test-iso-root out

          echo "hello from github actions" > test-iso-root/README.txt
          echo "commit: $GITHUB_SHA" > test-iso-root/BUILD.txt

      - name: Create base ISO
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V TEST_ISO \
            -o out/test.iso \
            test-iso-root

      - name: Upload test ISO
        uses: actions/upload-artifact@v4
        with:
          name: test-iso
          path: out/test.iso

  test-linux-ubi:
    name: Test blake3iso on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    needs: [build-linux-ubi, make-test-iso]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            file \
            which

      - name: Verify glibc version
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download test ISO
        uses: actions/download-artifact@v4
        with:
          name: test-iso
          path: downloaded/test-iso

      - name: Prepare test binary
        run: |
          set -euo pipefail
          mkdir -p testbin out
          cp downloaded/linux/blake3iso-linux-x86_64-gnu testbin/blake3iso
          chmod +x testbin/blake3iso
          cp downloaded/test-iso/test.iso out/test.iso

      - name: Show base ISO info
        run: |
          set -euo pipefail
          ls -lh out/test.iso
          file out/test.iso | tee out/file-base.txt

      - name: Copy ISO for ISOB3 test
        run: |
          set -euo pipefail
          cp out/test.iso out/test-isob3.iso

      - name: Check ISO before implant
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso check out/test-isob3.iso > out/isob3-check-before.txt 2>&1; then
            echo "Expected check before implant to fail, but it passed."
            cat out/isob3-check-before.txt
            exit 1
          else
            echo "Check before implant correctly failed."
            cat out/isob3-check-before.txt
          fi

      - name: Implant ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso implant out/test-isob3.iso | tee out/isob3-implant.txt

      - name: Show ISOB3 metadata info
        run: |
          set -euo pipefail
          testbin/blake3iso info out/test-isob3.iso | tee out/isob3-info.txt

      - name: Check implanted ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso check out/test-isob3.iso | tee out/isob3-check.txt

      - name: Corrupt ISOB3 ISO and confirm failure
        shell: bash
        run: |
          set -euo pipefail
          cp out/test-isob3.iso out/test-isob3-corrupt.iso
          printf 'Y' | dd of=out/test-isob3-corrupt.iso bs=1 seek=32768 count=1 conv=notrunc

          if testbin/blake3iso check out/test-isob3-corrupt.iso > out/isob3-check-corrupt.txt 2>&1; then
            echo "Expected corrupted ISOB3 ISO verification to fail, but it passed."
            cat out/isob3-check-corrupt.txt
            exit 1
          else
            echo "Corrupted ISOB3 ISO correctly failed verification."
            cat out/isob3-check-corrupt.txt
          fi

      - name: Remove ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso remove out/test-isob3.iso | tee out/isob3-remove.txt

      - name: Check ISO after metadata removal
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso check out/test-isob3.iso > out/isob3-check-after-remove.txt 2>&1; then
            echo "Expected check after removal to fail, but it passed."
            cat out/isob3-check-after-remove.txt
            exit 1
          else
            echo "Check after removal correctly failed."
            cat out/isob3-check-after-remove.txt
          fi

      - name: Upload Linux test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-linux-gnu
          path: out/

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, test-linux-ubi, build-windows]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries-windows
          path: downloaded/windows

      - name: Prepare package directories
        run: |
          set -euo pipefail
          rm -rf dist iso-root
          mkdir -p dist/linux dist/windows iso-root

          cp downloaded/linux/* dist/linux/
          cp downloaded/windows/* dist/windows/

          cp downloaded/linux/* iso-root/
          cp downloaded/windows/* iso-root/

      - name: Create Linux archive
        run: |
          set -euo pipefail
          tar -czf dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz -C dist/linux .

      - name: Create Windows archive
        run: |
          set -euo pipefail
          (
            cd dist/windows
            zip -r ../ISOB3TOOLS-windows-x86_64.zip .
          )

      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso zip

      - name: Create ISO bundle on Ubuntu
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V ISOB3TOOLS \
            -o dist/ISOB3TOOLS-binaries.iso \
            iso-root

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip
            dist/ISOB3TOOLS-binaries.iso

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, test-linux-ubi, build-windows, package]

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-artifacts
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux-ubi.outputs.release_tag }}
          name: ISOB3TOOLS ${{ needs.build-linux-ubi.outputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip
            dist/ISOB3TOOLS-binaries.iso