name: Build and Release ISOB3TOOLS

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Linux GNU binary on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            file \
            zip \
            gcc \
            gcc-c++ \
            make \
            which

      - name: Verify glibc version
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux GNU binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-unknown-linux-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-unknown-linux-gnu

      - name: Verify built binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-unknown-linux-gnu/release/blake3iso
          test -f target/x86_64-unknown-linux-gnu/release/ISOB3GUI

      - name: Collect binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/linux

          cp target/x86_64-unknown-linux-gnu/release/blake3iso \
            artifacts/linux/blake3iso-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/ISOB3GUI \
            artifacts/linux/ISOB3GUI-linux-x86_64-gnu

          cp README.md artifacts/linux/ || true

      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: built-binaries
          path: artifacts/**

      - name: Generate release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  test:
    name: Test blake3iso on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            file \
            which

      - name: Verify glibc version
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(ldd --version | head -n1 | grep -oE '[0-9]+\.[0-9]+')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries
          path: downloaded

      - name: Prepare test binary
        run: |
          set -euo pipefail
          mkdir -p testbin
          cp downloaded/linux/blake3iso-linux-x86_64-gnu testbin/blake3iso
          chmod +x testbin/blake3iso

      - name: Create test file
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          echo "hello from github actions" > out/test.txt

      - name: Implant/check/remove smoke test
        run: |
          set -euo pipefail

          cp out/test.txt out/test-isob3.bin

          if testbin/blake3iso check out/test-isob3.bin > out/check-before.txt 2>&1; then
            echo "Expected check before implant to fail, but it passed."
            cat out/check-before.txt
            exit 1
          fi

          testbin/blake3iso implant out/test-isob3.bin | tee out/implant.txt
          testbin/blake3iso info out/test-isob3.bin | tee out/info.txt
          testbin/blake3iso check out/test-isob3.bin | tee out/check.txt
          testbin/blake3iso remove out/test-isob3.bin | tee out/remove.txt

      - name: Upload test outputs
        uses: actions/upload-artifact@v4
        with:
          name: test-outputs-linux-gnu
          path: out/

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [build, test]

    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          name: built-binaries
          path: downloaded

      - name: Prepare package directories
        run: |
          set -euo pipefail
          rm -rf dist iso-root
          mkdir -p dist/linux iso-root

          cp downloaded/linux/* dist/linux/
          cp downloaded/linux/* iso-root/

      - name: Create Linux archive
        run: |
          set -euo pipefail
          tar -czf dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz -C dist/linux .

      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Create ISO bundle on Ubuntu
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V ISOB3TOOLS \
            -o dist/ISOB3TOOLS-binaries.iso \
            iso-root

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-binaries.iso

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, test, package]

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          name: packaged-artifacts
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          name: ISOB3TOOLS ${{ needs.build.outputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-binaries.iso