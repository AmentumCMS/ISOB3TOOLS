name: Build and Release ISOB3TOOLS

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR so stale runs don't waste
# runner minutes.  workflow_dispatch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  security-scan:
    name: CVE scan (cargo-audit + Trivy + Grype)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo-audit binary
        id: cache_audit
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.21.0-${{ runner.os }}

      - name: Install cargo-audit
        if: steps.cache_audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.21.0 --locked

      - name: Run cargo-audit (RustSec advisory database)
        id: cargo_audit
        run: cargo audit 2>&1 | tee cargo-audit.txt; echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: cargo-audit → job summary
        if: always()
        run: |
          {
            echo "## cargo-audit (RustSec)"
            if grep -q "Vulnerabilities found" cargo-audit.txt 2>/dev/null; then
              echo '```'
              cat cargo-audit.txt
              echo '```'
            else
              echo "✅ No advisories found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Trivy → job summary
        if: always()
        run: |
          {
            echo "## Trivy (HIGH/CRITICAL)"
            if [ -s trivy-results.txt ]; then
              echo '```'
              cat trivy-results.txt
              echo '```'
            else
              echo "✅ No HIGH or CRITICAL vulnerabilities found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Grype scan
        id: grype
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          path: .
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Grype → job summary
        if: always()
        run: |
          {
            echo "## Grype (HIGH/CRITICAL)"
            if [ "${{ steps.grype.outcome }}" = "success" ]; then
              echo "✅ No HIGH or CRITICAL vulnerabilities found."
            else
              echo "❌ HIGH or CRITICAL vulnerabilities detected — see Grype step log above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-linux-ubi:
    name: Build Linux GNU binaries on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            diffutils \
            file \
            gcc \
            gcc-c++ \
            make \
            which

      - name: Verify glibc version
        shell: bash
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo registry and build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/x86_64-unknown-linux-gnu/release/.fingerprint
            target/x86_64-unknown-linux-gnu/release/deps
            target/x86_64-unknown-linux-gnu/release/build
          key: cargo-linux-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-linux-gnu-

      - name: Build Linux GNU binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-unknown-linux-gnu
          cargo build --release --bin discdecrypt --target x86_64-unknown-linux-gnu
          cargo build --release --bin direnc --target x86_64-unknown-linux-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-unknown-linux-gnu

      - name: Verify built Linux binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-unknown-linux-gnu/release/blake3iso
          test -f target/x86_64-unknown-linux-gnu/release/discdecrypt
          test -f target/x86_64-unknown-linux-gnu/release/direnc
          test -f target/x86_64-unknown-linux-gnu/release/ISOB3GUI

      - name: Collect Linux binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/linux

          cp target/x86_64-unknown-linux-gnu/release/blake3iso \
            artifacts/linux/blake3iso-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/discdecrypt \
            artifacts/linux/discdecrypt-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/direnc \
            artifacts/linux/direnc-linux-x86_64-gnu
          cp target/x86_64-unknown-linux-gnu/release/ISOB3GUI \
            artifacts/linux/ISOB3GUI-linux-x86_64-gnu

          cp README.md artifacts/linux/ || true

      - name: Upload Linux binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-binaries-linux
          path: artifacts/linux/**
          retention-days: 7

      - name: Generate release tag
        if: github.event_name != 'pull_request'
        id: tag
        run: |
          echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows binaries on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system packages
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Cargo registry and build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/x86_64-pc-windows-gnu/release/.fingerprint
            target/x86_64-pc-windows-gnu/release/deps
            target/x86_64-pc-windows-gnu/release/build
          key: cargo-windows-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-windows-gnu-

      - name: Build Windows binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-pc-windows-gnu
          cargo build --release --bin discdecrypt --target x86_64-pc-windows-gnu
          cargo build --release --bin direnc --target x86_64-pc-windows-gnu
          cargo build --release --bin ISOB3GUI --target x86_64-pc-windows-gnu

      - name: Verify built Windows binaries exist
        run: |
          set -euo pipefail
          test -f target/x86_64-pc-windows-gnu/release/blake3iso.exe
          test -f target/x86_64-pc-windows-gnu/release/discdecrypt.exe
          test -f target/x86_64-pc-windows-gnu/release/direnc.exe
          test -f target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe

      - name: Collect Windows binaries
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts/windows

          cp target/x86_64-pc-windows-gnu/release/blake3iso.exe \
            artifacts/windows/blake3iso-windows-x86_64.exe
          cp target/x86_64-pc-windows-gnu/release/discdecrypt.exe \
            artifacts/windows/discdecrypt-windows-x86_64.exe
          cp target/x86_64-pc-windows-gnu/release/direnc.exe \
            artifacts/windows/direnc-windows-x86_64.exe
          cp target/x86_64-pc-windows-gnu/release/ISOB3GUI.exe \
            artifacts/windows/ISOB3GUI-windows-x86_64.exe

          cp README.md artifacts/windows/ || true

      - name: Upload Windows binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-binaries-windows
          path: artifacts/windows/**
          retention-days: 7

  make-test-iso:
    name: Create real test ISO on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Create test ISO contents
        run: |
          set -euo pipefail
          rm -rf test-iso-root out
          mkdir -p test-iso-root out

          echo "hello from github actions" > test-iso-root/README.txt
          echo "commit: $GITHUB_SHA" > test-iso-root/BUILD.txt
          mkdir -p test-iso-root/verification
          (
            cd test-iso-root
            sha256sum README.txt BUILD.txt > verification/SHA256SUMS
          )

      - name: Create base ISO
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V TEST_ISO \
            -o out/test.iso \
            test-iso-root

      - name: Upload test ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-iso
          path: out/test.iso
          retention-days: 7

  test-linux-ubi:
    name: Test blake3iso on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest
    needs: [build-linux-ubi, make-test-iso]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            diffutils \
            file \
            which

      - name: Verify glibc version
        run: |
          set -euo pipefail
          GLIBC_VERSION="$(ldd --version | sed -n '1s/.* //p')"
          echo "Detected glibc version: $GLIBC_VERSION"
          test "$GLIBC_VERSION" = "2.34"

      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download test ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-iso
          path: downloaded/test-iso

      - name: Prepare test binary
        run: |
          set -euo pipefail
          mkdir -p testbin out
          cp downloaded/linux/blake3iso-linux-x86_64-gnu testbin/blake3iso
          chmod +x testbin/blake3iso
          cp downloaded/test-iso/test.iso out/test.iso

      - name: Show base ISO info
        run: |
          set -euo pipefail
          ls -lh out/test.iso
          file out/test.iso | tee out/file-base.txt

      - name: Copy ISO for ISOB3 test
        run: |
          set -euo pipefail
          cp out/test.iso out/test-isob3.iso

      - name: Check ISO before implant
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso check out/test-isob3.iso > out/isob3-check-before.txt 2>&1; then
            echo "Expected check before implant to fail, but it passed."
            cat out/isob3-check-before.txt
            exit 1
          else
            echo "Check before implant correctly failed."
            cat out/isob3-check-before.txt
          fi

      - name: Implant ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso implant out/test-isob3.iso | tee out/isob3-implant.txt

      - name: Show ISOB3 metadata info
        run: |
          set -euo pipefail
          testbin/blake3iso info out/test-isob3.iso | tee out/isob3-info.txt

      - name: Check implanted ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso check out/test-isob3.iso | tee out/isob3-check.txt

      - name: Corrupt ISOB3 ISO and confirm failure
        shell: bash
        run: |
          set -euo pipefail
          cp out/test-isob3.iso out/test-isob3-corrupt.iso
          printf 'Y' | dd of=out/test-isob3-corrupt.iso bs=1 seek=32768 count=1 conv=notrunc

          if testbin/blake3iso check out/test-isob3-corrupt.iso > out/isob3-check-corrupt.txt 2>&1; then
            echo "Expected corrupted ISOB3 ISO verification to fail, but it passed."
            cat out/isob3-check-corrupt.txt
            exit 1
          else
            echo "Corrupted ISOB3 ISO correctly failed verification."
            cat out/isob3-check-corrupt.txt
          fi

      - name: Remove ISOB3 metadata
        run: |
          set -euo pipefail
          testbin/blake3iso remove out/test-isob3.iso | tee out/isob3-remove.txt

      - name: Check ISO after metadata removal
        shell: bash
        run: |
          set -euo pipefail
          if testbin/blake3iso check out/test-isob3.iso > out/isob3-check-after-remove.txt 2>&1; then
            echo "Expected check after removal to fail, but it passed."
            cat out/isob3-check-after-remove.txt
            exit 1
          else
            echo "Check after removal correctly failed."
            cat out/isob3-check-after-remove.txt
          fi

      - name: Generate ML-KEM-768 keypair
        run: |
          set -euo pipefail
          testbin/blake3iso keygen --output out/test-key | tee out/keygen.txt
          test -f out/test-key.ek
          test -f out/test-key.dk
          test "$(wc -c < out/test-key.ek)" -eq 1184
          test "$(wc -c < out/test-key.dk)" -eq 64

      - name: Upload Linux test outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-outputs-linux-gnu
          path: out/
          retention-days: 7

  test-linux-direnc:
    name: Test direnc on Ubuntu
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, build-windows, make-test-iso]

    steps:
      - name: Install xorriso
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso

      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-windows
          path: downloaded/windows

      - name: Download test ISO
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-iso
          path: downloaded/test-iso

      - name: Prepare test binaries
        run: |
          set -euo pipefail
          mkdir -p testbin out
          cp downloaded/linux/blake3iso-linux-x86_64-gnu testbin/blake3iso
          cp downloaded/linux/discdecrypt-linux-x86_64-gnu testbin/discdecrypt
          cp downloaded/linux/direnc-linux-x86_64-gnu testbin/direnc
          cp downloaded/windows/discdecrypt-windows-x86_64.exe testbin/discdecrypt.exe
          chmod +x testbin/blake3iso
          chmod +x testbin/discdecrypt
          chmod +x testbin/direnc
          cp downloaded/test-iso/test.iso out/test.iso

      - name: Extract test ISO contents
        run: |
          set -euo pipefail
          rm -rf out/iso-staging
          mkdir -p out/iso-staging
          xorriso -osirrox on -indev out/test.iso -extract / out/iso-staging

      - name: Encrypt directory with direnc
        run: |
          set -euo pipefail
          testbin/direnc out/iso-staging \
            --password secret \
            --exclude ./verification/ | tee out/direnc.txt

      - name: Rebuild encrypted ISO with xorriso
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -o out/test-encrypted.iso \
            out/iso-staging

      - name: Implant ISOB3 into rebuilt ISO
        run: |
          set -euo pipefail
          testbin/blake3iso implant out/test-encrypted.iso | tee out/direnc-implant.txt

      - name: Check rebuilt encrypted ISO ISOB3
        run: |
          set -euo pipefail
          testbin/blake3iso check out/test-encrypted.iso | tee out/direnc-check-isob3.txt

      - name: Confirm payload files were encrypted in place
        run: |
          set -euo pipefail
          test -f out/iso-staging/README.txt
          test -f out/iso-staging/BUILD.txt
          test -f out/iso-staging/verification/SHA256SUMS
          test -f out/iso-staging/decryptor/discdecrypt
          test -f out/iso-staging/decryptor/discdecrypt.exe
          test -f out/iso-staging/decryptor/decrypt.sh
          test "$(head -c 8 out/iso-staging/README.txt)" = "DBENC004"
          test "$(head -c 8 out/iso-staging/BUILD.txt)" = "DBENC004"
          if test "$(head -c 8 out/iso-staging/verification/SHA256SUMS)" = "DBENC004"; then
            echo "Manifest file should not have been encrypted."
            exit 1
          fi
          if test "$(head -c 8 out/iso-staging/decryptor/discdecrypt)" = "DBENC004"; then
            echo "Embedded decryptor should not have been encrypted."
            exit 1
          fi
          if test "$(head -c 8 out/iso-staging/decryptor/discdecrypt.exe)" = "DBENC004"; then
            echo "Embedded Windows decryptor should not have been encrypted."
            exit 1
          fi

      - name: Run embedded decryptor against staged disc contents
        run: |
          set -euo pipefail
          chmod +x out/iso-staging/decryptor/discdecrypt
          out/iso-staging/decryptor/discdecrypt \
            --input out/iso-staging \
            --output out/decrypted-tree \
            --password secret | tee out/discdecrypt.txt
          test -f out/decrypted-tree/README.txt
          test -f out/decrypted-tree/BUILD.txt
          test -f out/decrypted-tree/verification/SHA256SUMS

      - name: Verify decrypted payload content
        run: |
          set -euo pipefail
          printf 'hello from github actions\n' > out/README.expected.txt
          printf 'commit: %s\n' "$GITHUB_SHA" > out/BUILD.expected.txt
          cmp out/decrypted-tree/README.txt out/README.expected.txt
          cmp out/decrypted-tree/BUILD.txt out/BUILD.expected.txt
          cmp out/decrypted-tree/verification/SHA256SUMS out/iso-staging/verification/SHA256SUMS

      - name: Confirm decrypted payload hashes still match manifest
        run: |
          set -euo pipefail
          (
            cd out/decrypted-tree
            sha256sum README.txt BUILD.txt > ../../out/decrypted.hashes
          )
          manifest_readme="$(awk '/README.txt$/ { print $1 }' out/iso-staging/verification/SHA256SUMS)"
          manifest_build="$(awk '/BUILD.txt$/ { print $1 }' out/iso-staging/verification/SHA256SUMS)"
          actual_readme="$(awk '/README.txt$/ { print $1 }' out/decrypted.hashes)"
          actual_build="$(awk '/BUILD.txt$/ { print $1 }' out/decrypted.hashes)"
          test "$manifest_readme" = "$actual_readme"
          test "$manifest_build" = "$actual_build"

      - name: Upload direnc test outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-outputs-linux-direnc
          path: out/
          retention-days: 7

      - name: Upload generated encrypted ISO
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-encrypted-iso
          path: out/test-encrypted.iso
          retention-days: 7

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, test-linux-ubi, test-linux-direnc, build-windows]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-linux
          path: downloaded/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-windows
          path: downloaded/windows

      - name: Prepare package directories
        run: |
          set -euo pipefail
          rm -rf dist iso-root
          mkdir -p dist/linux dist/windows iso-root

          cp downloaded/linux/* dist/linux/
          cp downloaded/windows/* dist/windows/

          cp downloaded/linux/* iso-root/
          cp downloaded/windows/* iso-root/

      - name: Create Linux archive
        run: |
          set -euo pipefail
          tar -czf dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz -C dist/linux .

      - name: Install xorriso and zip
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xorriso zip

      - name: Create Windows archive
        run: |
          set -euo pipefail
          (
            cd dist/windows
            zip -r ../ISOB3TOOLS-windows-x86_64.zip .
          )

      - name: Create ISO bundle
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -V ISOB3TOOLS \
            -o dist/ISOB3TOOLS-binaries.iso \
            iso-root

      - name: Implant and verify ISOB3 in release ISO
        run: |
          set -euo pipefail
          chmod +x dist/linux/blake3iso-linux-x86_64-gnu
          dist/linux/blake3iso-linux-x86_64-gnu implant dist/ISOB3TOOLS-binaries.iso
          dist/linux/blake3iso-linux-x86_64-gnu check  dist/ISOB3TOOLS-binaries.iso
          dist/linux/blake3iso-linux-x86_64-gnu info   dist/ISOB3TOOLS-binaries.iso

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-artifacts
          path: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip
            dist/ISOB3TOOLS-binaries.iso

  virus-scan-defender:
    name: Virus scan (Microsoft Defender)
    runs-on: windows-latest
    needs: [build-linux-ubi, build-windows]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-linux
          path: scan-targets\linux

      - name: Download Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-windows
          path: scan-targets\windows

      - name: Update Defender signatures
        run: Update-MpSignature

      - name: Run Microsoft Defender scan
        id: defender
        run: |
          $scanPath = "${{ github.workspace }}\scan-targets"
          Start-MpScan -ScanPath $scanPath -ScanType CustomScan
          $threats = Get-MpThreatDetection
          if ($threats) {
            $threats | Format-List | Out-String | Set-Content defender-threats.txt
            Write-Output "infected_count=$($threats.Count)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "infected_count=0" >> $env:GITHUB_OUTPUT
          }

      - name: Defender → job summary
        if: always()
        shell: pwsh
        run: |
          $count = "${{ steps.defender.outputs.infected_count }}"
          $summary = @()
          $summary += "## 🛡️ Microsoft Defender Scan"
          if ($count -eq "0" -or $count -eq "") {
            $summary += "✅ No threats detected."
          } else {
            $summary += "❌ **$count threat(s) detected.**"
            $summary += '```'
            $summary += Get-Content defender-threats.txt -ErrorAction SilentlyContinue
            $summary += '```'
          }
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Fail if threats found
        if: steps.defender.outputs.infected_count != '0' && steps.defender.outputs.infected_count != ''
        run: exit 1

  virus-scan:
    name: Virus scan (ClamAV)
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, build-windows, package]

    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-linux
          path: scan-targets/linux

      - name: Download Windows binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-binaries-windows
          path: scan-targets/windows

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packaged-artifacts
          path: scan-targets/packaged

      - name: Install ClamAV
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Cache ClamAV virus definitions
        id: clamav_db_cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: /var/lib/clamav
          key: clamav-db-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: clamav-db-${{ runner.os }}-

      - name: Get current date for cache key
        id: date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Update ClamAV definitions (if cache miss)
        if: steps.clamav_db_cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet

      - name: Run ClamAV scan
        id: clamav
        run: |
          set -euo pipefail
          clamscan \
            --recursive \
            --infected \
            --no-summary \
            scan-targets/ \
            | tee clamav-infected.txt || true
          clamscan \
            --recursive \
            --no-summary \
            scan-targets/ \
            2>&1 | tail -5 | tee clamav-summary.txt || true
          INFECTED=$(grep -c '.*FOUND$' clamav-infected.txt 2>/dev/null) || INFECTED=0
          echo "infected_count=${INFECTED}" >> "$GITHUB_OUTPUT"
          if [ "$INFECTED" -gt 0 ]; then
            echo "::error::ClamAV detected ${INFECTED} infected file(s). See job summary."
            exit 1
          fi

      - name: ClamAV → job summary
        if: always()
        run: |
          {
            echo "## 🦠 ClamAV Virus Scan"
            INFECTED="${{ steps.clamav.outputs.infected_count }}"
            if [ "${INFECTED:-0}" -eq 0 ] && [ "${{ steps.clamav.outcome }}" = "success" ]; then
              echo "✅ No threats detected."
            else
              echo "❌ **${INFECTED:-unknown} infected file(s) detected.**"
              echo '```'
              cat clamav-infected.txt 2>/dev/null || echo "(no output)"
              echo '```'
            fi
            echo ""
            echo "<details><summary>Scan summary</summary>"
            echo ""
            echo '```'
            cat clamav-summary.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build-linux-ubi, test-linux-ubi, test-linux-direnc, build-windows, package, security-scan, virus-scan, virus-scan-defender]

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: packaged-artifacts
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build-linux-ubi.outputs.release_tag }}
          name: ISOB3TOOLS ${{ needs.build-linux-ubi.outputs.release_tag }}
          generate_release_notes: true
          prerelease: true
          files: |
            dist/ISOB3TOOLS-linux-x86_64-gnu.tar.gz
            dist/ISOB3TOOLS-windows-x86_64.zip
            dist/ISOB3TOOLS-binaries.iso
