name: Large ISO Manual Test

on:
  workflow_dispatch:
    inputs:
      large_iso_url:
        description: "Download URL for the large ISO fixture"
        required: true
        type: string
      password:
        description: "Password to use for isoenc bundling"
        required: true
        default: "secret"
        type: string
      exclude:
        description: "Comma-separated exclude directories for isoenc"
        required: false
        default: "./verification/"
        type: string

permissions:
  contents: read

jobs:
  test-large-iso:
    name: Run large ISO encryption flow
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xorriso

      - name: Download latest release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded testbin
          release_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$release_tag" ] || [ "$release_tag" = "null" ]; then
            echo "No GitHub release found for $GITHUB_REPOSITORY"
            exit 2
          fi

          echo "Using release: $release_tag"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ISOB3TOOLS-linux-x86_64-gnu.tar.gz" \
            --dir downloaded

          tar -xzf downloaded/ISOB3TOOLS-linux-x86_64-gnu.tar.gz -C testbin
          cp testbin/blake3iso-linux-x86_64-gnu testbin/blake3iso
          cp testbin/discdecrypt-linux-x86_64-gnu testbin/discdecrypt
          cp testbin/isoenc-linux-x86_64-gnu testbin/isoenc

      - name: Prepare binaries
        run: |
          set -euo pipefail
          chmod +x testbin/blake3iso
          chmod +x testbin/discdecrypt
          chmod +x testbin/isoenc

      - name: Download large ISO
        run: |
          set -euo pipefail
          mkdir -p out/input
          (
            cd out/input
            curl -L --fail --remote-name --remote-header-name "${{ inputs.large_iso_url }}"
          )

          input_path="$(find out/input -maxdepth 1 -type f | sort | head -n 1)"
          if [ -z "$input_path" ]; then
            echo "No ISO file was downloaded."
            exit 2
          fi

          iso_name="$(basename "$input_path")"
          if [[ "$iso_name" == *.[iI][sS][oO] ]]; then
            output_name="${iso_name%.[iI][sS][oO]}.encrypted.iso"
          else
            output_name="${iso_name}.encrypted.iso"
          fi
          output_path="out/$output_name"

          echo "LARGE_ISO_INPUT=$input_path" >> "$GITHUB_ENV"
          echo "LARGE_ISO_OUTPUT=$output_path" >> "$GITHUB_ENV"
          ls -lh "$input_path"

      - name: Build encrypted ISO from large input
        run: |
          set -euo pipefail
          testbin/isoenc bundle "$LARGE_ISO_INPUT" \
            --output "$LARGE_ISO_OUTPUT" \
            --password "${{ inputs.password }}" \
            --exclude "${{ inputs.exclude }}" \
            --implant-isob3 | tee out/isoenc-large-bundle.txt

      - name: Verify rebuilt encrypted ISO
        run: |
          set -euo pipefail
          testbin/blake3iso check "$LARGE_ISO_OUTPUT" | tee out/isoenc-large-check.txt
          testbin/blake3iso info "$LARGE_ISO_OUTPUT" | tee out/isoenc-large-info.txt

      - name: Upload large ISO outputs
        uses: actions/upload-artifact@v4
        with:
          name: large-iso-results
          path: |
            out/isoenc-large-bundle.txt
            out/isoenc-large-check.txt
            out/isoenc-large-info.txt
            out/*.encrypted.iso
