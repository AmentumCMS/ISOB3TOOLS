name: Large ISO Manual Test

on:
  workflow_dispatch:
    inputs:
      large_iso_url:
        description: "Download URL for the large ISO fixture"
        required: true
        type: string
      password:
        description: "Password to use for direnc"
        required: true
        default: "secret"
        type: string
      exclude:
        description: "Comma-separated exclude directories for direnc"
        required: false
        default: "./verification/"
        type: string

permissions:
  contents: read

jobs:
  test-large-iso:
    name: Run large ISO encryption flow
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip xorriso

      - name: Download latest release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded testbin
          release_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$release_tag" ] || [ "$release_tag" = "null" ]; then
            echo "No GitHub release found for $GITHUB_REPOSITORY"
            exit 2
          fi

          echo "Using release: $release_tag"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ISOB3TOOLS-linux-x86_64-gnu.tar.gz" \
            --pattern "ISOB3TOOLS-windows-x86_64.zip" \
            --dir downloaded

          tar -xzf downloaded/ISOB3TOOLS-linux-x86_64-gnu.tar.gz -C testbin
          unzip -q downloaded/ISOB3TOOLS-windows-x86_64.zip -d testbin/windows
          cp testbin/blake3iso-linux-x86_64-gnu testbin/blake3iso
          cp testbin/discdecrypt-linux-x86_64-gnu testbin/discdecrypt
          cp testbin/direnc-linux-x86_64-gnu testbin/direnc
          cp testbin/windows/discdecrypt-windows-x86_64.exe testbin/discdecrypt.exe

      - name: Prepare binaries
        run: |
          set -euo pipefail
          chmod +x testbin/blake3iso
          chmod +x testbin/discdecrypt
          chmod +x testbin/direnc

      - name: Download large ISO
        run: |
          set -euo pipefail
          mkdir -p out/input
          (
            cd out/input
            curl -L --fail --remote-name --remote-header-name "${{ inputs.large_iso_url }}"
          )

          input_path="$(find out/input -maxdepth 1 -type f | sort | head -n 1)"
          if [ -z "$input_path" ]; then
            echo "No ISO file was downloaded."
            exit 2
          fi

          iso_name="$(basename "$input_path")"
          if [[ "$iso_name" == *.[iI][sS][oO] ]]; then
            output_name="${iso_name%.[iI][sS][oO]}.encrypted.iso"
          else
            output_name="${iso_name}.encrypted.iso"
          fi

          echo "LARGE_ISO_INPUT=$input_path" >> "$GITHUB_ENV"
          echo "LARGE_ISO_OUTPUT=out/$output_name" >> "$GITHUB_ENV"
          ls -lh "$input_path"

      - name: Extract large ISO contents
        run: |
          set -euo pipefail
          rm -rf out/iso-staging
          mkdir -p out/iso-staging
          xorriso -osirrox on -indev "$LARGE_ISO_INPUT" -extract / out/iso-staging

      - name: Encrypt directory with direnc
        run: |
          set -euo pipefail
          testbin/direnc out/iso-staging \
            --password "${{ inputs.password }}" \
            --exclude "${{ inputs.exclude }}" | tee out/direnc-large.txt

      - name: Rebuild encrypted ISO with xorriso
        run: |
          set -euo pipefail
          xorriso -as mkisofs \
            -r \
            -J \
            -o "$LARGE_ISO_OUTPUT" \
            out/iso-staging

      - name: Implant ISOB3 into rebuilt ISO
        run: |
          set -euo pipefail
          testbin/blake3iso implant "$LARGE_ISO_OUTPUT" | tee out/direnc-large-implant.txt

      - name: Verify rebuilt encrypted ISO
        run: |
          set -euo pipefail
          testbin/blake3iso check "$LARGE_ISO_OUTPUT" | tee out/direnc-large-check.txt
          testbin/blake3iso info "$LARGE_ISO_OUTPUT" | tee out/direnc-large-info.txt

      - name: Confirm bundled decryptors exist in staging directory
        run: |
          set -euo pipefail
          test -f out/iso-staging/decryptor/discdecrypt
          test -f out/iso-staging/decryptor/discdecrypt.exe

      - name: Upload large ISO outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: large-iso-results
          path: |
            out/direnc-large.txt
            out/direnc-large-implant.txt
            out/direnc-large-check.txt
            out/direnc-large-info.txt
            out/*.encrypted.iso
