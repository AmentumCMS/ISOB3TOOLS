name: Large ISO Manual Test

on:
  workflow_dispatch:
    inputs:
      large_iso_url:
        description: "Download URL for the large ISO fixture"
        required: true
        type: string
      password:
        description: "Password to use for isoenc bundling"
        required: true
        default: "secret"
        type: string
      exclude:
        description: "Comma-separated exclude directories for isoenc"
        required: false
        default: "./verification/"
        type: string

jobs:
  build-linux-ubi:
    name: Build Linux GNU binaries on UBI9
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          set -euo pipefail
          dnf -y update
          dnf -y install \
            file \
            gcc \
            gcc-c++ \
            make \
            which

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Linux GNU binaries
        run: |
          set -euo pipefail
          cargo build --release --bin blake3iso --target x86_64-unknown-linux-gnu
          cargo build --release --bin discdecrypt --target x86_64-unknown-linux-gnu
          cargo build --release --bin isoenc --target x86_64-unknown-linux-gnu

      - name: Upload Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: large-iso-linux-binaries
          path: |
            target/x86_64-unknown-linux-gnu/release/blake3iso
            target/x86_64-unknown-linux-gnu/release/discdecrypt
            target/x86_64-unknown-linux-gnu/release/isoenc

  test-large-iso:
    name: Run large ISO encryption flow
    runs-on: ubuntu-latest
    needs: [build-linux-ubi]

    steps:
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl xorriso

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: large-iso-linux-binaries
          path: testbin

      - name: Prepare binaries
        run: |
          set -euo pipefail
          chmod +x testbin/blake3iso
          chmod +x testbin/discdecrypt
          chmod +x testbin/isoenc

      - name: Download large ISO
        run: |
          set -euo pipefail
          mkdir -p out
          iso_name="$(basename "${{ inputs.large_iso_url }}")"
          iso_name="${iso_name%%\?*}"
          iso_name="${iso_name%%#*}"
          if [ -z "$iso_name" ] || [ "$iso_name" = "." ] || [ "$iso_name" = ".." ]; then
            iso_name="large-input.iso"
          fi
          if [ "${iso_name##*.}" != "iso" ]; then
            iso_name="${iso_name}.iso"
          fi

          input_path="out/$iso_name"
          output_name="${iso_name%.iso}.encrypted.iso"
          output_path="out/$output_name"

          echo "LARGE_ISO_INPUT=$input_path" >> "$GITHUB_ENV"
          echo "LARGE_ISO_OUTPUT=$output_path" >> "$GITHUB_ENV"

          curl -L --fail --output "$input_path" "${{ inputs.large_iso_url }}"
          ls -lh "$input_path"

      - name: Build encrypted ISO from large input
        run: |
          set -euo pipefail
          testbin/isoenc bundle "$LARGE_ISO_INPUT" \
            --output "$LARGE_ISO_OUTPUT" \
            --password "${{ inputs.password }}" \
            --exclude "${{ inputs.exclude }}" \
            --implant-isob3 | tee out/isoenc-large-bundle.txt

      - name: Verify rebuilt encrypted ISO
        run: |
          set -euo pipefail
          testbin/blake3iso check "$LARGE_ISO_OUTPUT" | tee out/isoenc-large-check.txt
          testbin/blake3iso info "$LARGE_ISO_OUTPUT" | tee out/isoenc-large-info.txt

      - name: Upload large ISO outputs
        uses: actions/upload-artifact@v4
        with:
          name: large-iso-results
          path: |
            out/isoenc-large-bundle.txt
            out/isoenc-large-check.txt
            out/isoenc-large-info.txt
            out/*.encrypted.iso
